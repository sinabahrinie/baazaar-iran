<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign-up</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
     <header>
        <nav>
            <ul>
                <li>
                    <a class="logo">بازار ایران</a>
                </li>
                <li>
                    <a href="./product-list.html">خانه</a>
                </li>
                <li>
                    <a href="#">منو</a>
                </li>
            </ul>
        </nav>
        <div class="product-listheader-login-pricing">
            <a href="./Sign-up.html">ورود</a>
            <button class="product-listheader-login-pricing-link" type="submit">سبد خرید</button>
        </div>
    </header>
    <form action="./product-list.html" method="get" class="sign-up">
        <h2>ساخت حساب کاربری</h2>
        <p>برای خرید سریع،حساب بازارایران را بسازید.</p>
        <label>ایمیل<input type="email" placeholder="example@gmail.com"/></label>
        <label>شماره همراه<input type="tel" placeholder="09123456789"/></label>
        <label>رمز عبور<input type="password" minlength="8" maxlength="64" placeholder="حداقل 8 کاراکتر"/></label>
        <label>تکرار رمز عبور<input type="password" minlength="8" maxlength="64" placeholder="رمز عبور را دوباره وارد کنید"/></label>
        <div class="sign-up-button">
        <button  type="reset">پاک کردن</button>
        <button  type="submit">ثبت نام</button>
        </div>
    </form>


    <footer>
        <div class="product-list-footer">
            <p>بازارایران،خرید ساده و مطمئن</p>
            <div class="product-list-footer-link">
                <a href="#">پشتیبانی</a>
                <a href="#">قوانین و شرایط</a>
                <a href="#">اینستاگرام</a>
            </div>
            <p><span>&copy;</span>1405</p>
        </div>
    </footer>

</body>
</html>
